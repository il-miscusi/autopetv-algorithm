# CI canary: builds the algorithm container on every v* tag so a broken
# Dockerfile is caught before the Grand Challenge linked-repo build spends
# its own build. The image is self-contained (weights downloaded and
# hash-verified inside the docker build). No artifacts are published — the
# GC linked-repo build is the shipping path.
name: build-container

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Build image
        run: |
          docker build --platform=linux/amd64 --tag autopetv_algorithm .
          docker image ls autopetv_algorithm
