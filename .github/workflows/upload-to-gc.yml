# Uploads a built container image (release assets of the given tag) to the
# Grand Challenge algorithm via gcapi. Needs repo secret GC_TOKEN (a
# grand-challenge.org API token from the operator's account).
name: upload-to-gc

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets to upload"
        required: true
        default: "v1"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and reassemble image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -p 'autopetv_algorithm.tar.gz.part-*'
          cat autopetv_algorithm.tar.gz.part-* > autopetv_algorithm.tar.gz
          rm autopetv_algorithm.tar.gz.part-*
          ls -lh autopetv_algorithm.tar.gz

      - name: Upload to Grand Challenge
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
        run: |
          pip install -q gcapi
          python upload_to_gc.py autopetv_algorithm.tar.gz \
            scribble-conformant-cached-nnu-net
