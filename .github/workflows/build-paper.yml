name: build-paper

on:
  push:
    paths: ["paper/**"]
  workflow_dispatch: {}

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
